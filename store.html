<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The store has moved — Tom Bannerman</title>
<meta name="robots" content="noindex">
<meta http-equiv="refresh" content="0; url=https://shop.tombannerman.com">
<link rel="canonical" href="https://shop.tombannerman.com">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT,WONK@9..144,300..700,0..100,0..1&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--paper:#fff7e6;--ink:#2A1733;--ink-soft:#5a4660;--violet:#922aff}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--paper);color:var(--ink);
  font-family:"Space Mono",monospace;display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;padding:40px 24px;gap:18px}
h1{font-family:"Fraunces",serif;font-weight:500;font-size:clamp(22px,4vw,30px);margin:0;letter-spacing:-.01em}
p{color:var(--ink-soft);font-size:13px;letter-spacing:.5px;max-width:46ch;margin:0}
.links{display:flex;flex-wrap:wrap;gap:9px;justify-content:center;margin-top:8px}
.links a{font-size:12px;letter-spacing:.5px;text-transform:uppercase;border:1.5px solid var(--ink);
  color:var(--ink);padding:9px 16px;border-radius:30px;text-decoration:none;transition:.2s}
.links a:hover{background:var(--ink);color:var(--paper);transform:translateY(-2px)}
.url{font-size:14px;letter-spacing:.5px;word-break:break-all;text-transform:none}
.url b{font-weight:400;color:var(--violet)}
</style></head><body>
<h1 id="state">Taking you to the store&hellip;</h1>
<p id="detail">If nothing happens in a few seconds, use the link below.</p>
<div class="links">
  <a class="url" href="https://shop.tombannerman.com">shop<b>.</b>tombannerman.com &rarr;</a>
  <a href="/">Back to tombannerman.com</a>
</div>
<script>
// Three things try to move you: the meta refresh in the head, this replace(), and
// finally the visible link. If all of them are still blocked four seconds later, say so
// plainly rather than leaving a page that claims to be routing and never does.
location.replace("https://shop.tombannerman.com");
setTimeout(function () {
  document.getElementById("state").textContent = "That redirect didn’t go through.";
  document.getElementById("detail").textContent = "Open the store directly:";
}, 4000);
</script>
</body></html>
